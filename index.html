<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cadence — a steady rhythm for the things you repeat."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Key and precedence must match src/lib/theme.tsx.
      (() => {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
        let stored = null;
        try {
          stored = localStorage.getItem("cadence-theme");
        } catch {
          // Blocked site data or private mode; fall through to the OS setting.
        }
        const dark =
          stored === "dark" ||
          ((stored === "system" || stored === null) && prefersDark.matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <title>Cadence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
