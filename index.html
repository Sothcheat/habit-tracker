<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cadence — a steady rhythm for the things you repeat."
    />
    <!--
      Montserrat is self-hosted and declared in src/index.css. Preloaded here
      because it is only discovered once the stylesheet has parsed, which is
      one round trip too late for the first paint. `crossorigin` is required
      even same-origin: fonts are always fetched in CORS mode, and without it
      the browser downloads the file twice.
    -->
    <link
      rel="preload"
      href="/fonts/montserrat-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Key and precedence must match src/lib/theme.tsx.
      (() => {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
        let stored = null;
        try {
          stored = localStorage.getItem("cadence-theme");
        } catch {
          // Blocked site data or private mode; fall through to the OS setting.
        }
        const dark =
          stored === "dark" ||
          ((stored === "system" || stored === null) && prefersDark.matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <title>Cadence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
